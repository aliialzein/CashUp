services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cashup_test
      POSTGRES_USER: cashup_test
      POSTGRES_PASSWORD: cashup_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashup_test -d cashup_test"]
      interval: 2s
      timeout: 3s
      retries: 30
