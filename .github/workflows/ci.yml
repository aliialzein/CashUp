name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cashup_test
          POSTGRES_USER: cashup_test
          POSTGRES_PASSWORD: cashup_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cashup_test -d cashup_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://cashup_test:cashup_test@127.0.0.1:55432/cashup_test

      - name: Build
        run: npm run build
